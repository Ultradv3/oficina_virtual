name: agent-office

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://opencode:4096}
      OPENCODE_DIRECTORY: ${OPENCODE_DIRECTORY:-/workspace}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      AGENT_OFFICE_TOKEN: ${AGENT_OFFICE_TOKEN:-}
      AGENT_OFFICE_DB: /data/agent-office.db
    volumes:
      - agent-office-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  opencode:
    profiles: ['with-opencode']
    build:
      context: .
      dockerfile: Dockerfile.opencode
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      - ${OPENCODE_WORKSPACE:-.}:/workspace
      - opencode-state:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode

volumes:
  agent-office-data:
  opencode-state:
  opencode-config:
